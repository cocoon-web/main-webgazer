<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIN Protocol - Eyetracking & Narrative Sync (v3.1)</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f4; overflow: hidden; }
        h2 { margin: 20px 0; color: #333; }
        
        /* Main Buttons */
        .btn { padding: 15px 40px; font-size: 20px; cursor: pointer; border: none; border-radius: 8px; margin: 20px; transition: 0.3s; }
        #startButton { background-color: #28a745; color: white; margin-top: 15%; }
        #stopButton { display: none; background-color: #dc3545; color: white; position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
        #reviewButton { display: none; background-color: #6c757d; color: white; position: fixed; bottom: 20px; left: 20px; z-index: 2000; }

        /* Slideshow Container */
        #main-slideshow { display: none; width: 95%; max-width: 1200px; margin: 0 auto; height: 80vh; position: relative; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }

        /* Calibration Points */
        .calibration-point { width: 30px; height: 30px; background-color: #ff4757; border-radius: 50%; position: absolute; cursor: pointer; z-index: 1500; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #calibracion-container { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.2); z-index: 1500; }
        
        /* Status Message */
        #status-message { font-size: 1.4em; margin: 20px; min-height: 50px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; display: inline-block; border: 1px solid #ddd; }

        /* Heatmap Canvas */
        #heatmap-canvas { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1800; pointer-events: none; }
    </style>
</head>
<body>

    <h2 id="status-message">Step 1: Press START to begin</h2>
    
    <button id="startButton" class="btn" onclick="startExperiment()">START DATA COLLECTION</button>
    <button id="stopButton" class="btn" onclick="stopExperiment()">FINISH & SAVE DATA</button>
    <button id="reviewButton" class="btn" onclick="showHeatmap()">REVIEW HEATMAP</button>

    <div id="calibracion-container"></div>

    <div class="swiper mySwiper" id="main-slideshow">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="main_img/cat-picture1.png" alt="Picture 1"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture2.png" alt="Picture 2"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture3.png" alt="Picture 3"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture4.png" alt="Picture 4"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture5.png" alt="Picture 5"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture6.png" alt="Picture 6"></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
        
        <canvas id="heatmap-canvas"></canvas>
    </div>

    <script src="webgazer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        let webgazerData = [];
        let mediaRecorder;
        let audioChunks = [];
        let isCalibrating = false;
        let participantID = "PILOT";
        
        const calibrationPoints = [[10,10], [50,10], [90,10], [10,50], [50,50], [90,50], [10,90], [50,90], [90,90]];
        let currentPointIndex = 0;
        let calibrationClicks = 0;

        const message = document.getElementById('status-message');
        const startBtn = document.getElementById('startButton');
        const stopBtn = document.getElementById('stopButton');
        const reviewBtn = document.getElementById('reviewButton');
        const calibContainer = document.getElementById('calibracion-container');
        const slideshow = document.getElementById('main-slideshow');
        const heatmapCanvas = document.getElementById('heatmap-canvas');

        const swiper = new Swiper('.mySwiper', {
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            pagination: { el: '.swiper-pagination', clickable: true },
            keyboard: { enabled: true },
        });

        swiper.on('slideChange', () => {
            if(heatmapCanvas.style.display === 'block') {
                heatmapCanvas.style.display = 'none';
                reviewBtn.innerText = "REVIEW HEATMAP";
            }
        });

        async function startExperiment() {
            const inputID = prompt("Participant ID:", "SUBJ_001");
            if (inputID) participantID = inputID.trim();

            startBtn.style.display = 'none';
            message.innerText = "Step 2: Calibration – Focus on the red dot and click it 5 times.";

            await webgazer.setGazeListener((data, elapsedTime) => {
                if (data && !isCalibrating) {
                    webgazerData.push({ 
                        t: Math.round(elapsedTime), 
                        x: Math.round(data.x), 
                        y: Math.round(data.y),
                        pic: swiper.activeIndex + 1 
                    });
                }
            }).begin();

            webgazer.showVideoPreview(true).showPredictionPoints(false);
            isCalibrating = true;
            calibContainer.style.display = 'block';
            createCalibrationPoint(0);
        }

        function createCalibrationPoint(index) {
            calibContainer.innerHTML = '';
            const [left, top] = calibrationPoints[index];
            const point = document.createElement('div');
            point.className = 'calibration-point';
            point.style.left = `${left}%`;
            point.style.top = `${top}%`;

            point.onclick = (e) => {
                webgazer.recordScreenClick(e.clientX, e.clientY);
                calibrationClicks++;
                point.style.opacity = 1 - (calibrationClicks * 0.18);

                if (calibrationClicks >= 5) {
                    calibrationClicks = 0;
                    currentPointIndex++;
                    if (currentPointIndex < calibrationPoints.length) {
                        createCalibrationPoint(currentPointIndex);
                    } else {
                        finishCalibration();
                    }
                }
            };
            calibContainer.appendChild(point);
        }

        function finishCalibration() {
            isCalibrating = false;
            calibContainer.style.display = 'none';
            webgazer.showVideoPreview(false);

            message.innerText = "Step 3: Tell the story in your own words...";
            slideshow.style.display = 'block';
            stopBtn.style.display = 'inline-block';
            swiper.slideTo(0);

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = exportAudio;
                mediaRecorder.start();
                console.log("Audio recording started");
            }).catch(err => {
                console.error("Mic error:", err);
                alert("Warning: Audio recording could not be started.");
            });
        }

        function stopExperiment() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            webgazer.pause();
            
            message.innerText = "Finished! Saving data...";
            stopBtn.style.display = 'none';

            // Master CSV Export (Gaze + Picture ID)
            const headers = "timestamp_ms,x_px,y_px,picture_id";
            const rows = webgazerData.map(d => `${d.t},${d.x},${d.y},${d.pic}`);
            saveFile([headers, ...rows].join('\n'), `${participantID}_EYE_TRACKING_DATA.csv`, 'text/csv');

            reviewBtn.style.display = 'inline-block';
        }

        function exportAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            saveFile(audioBlob, `${participantID}_NARRATIVE_AUDIO.webm`, 'audio/webm');
            audioChunks = [];
        }

        function saveFile(content, filename, type) {
            const blob = (content instanceof Blob) ? content : new Blob([content], { type: `${type};charset=utf-8;` });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        function showHeatmap() {
            if (heatmapCanvas.style.display === 'block') {
                heatmapCanvas.style.display = 'none';
                reviewBtn.innerText = "REVIEW HEATMAP";
                return;
            }

            const ctx = heatmapCanvas.getContext('2d');
            const activeSlide = swiper.slides[swiper.activeIndex];
            const img = activeSlide.querySelector('img');
            
            heatmapCanvas.width = img.clientWidth;
            heatmapCanvas.height = img.clientHeight;
            heatmapCanvas.style.width = `${img.clientWidth}px`;
            heatmapCanvas.style.height = `${img.clientHeight}px`;
            heatmapCanvas.style.top = `${img.offsetTop}px`;
            heatmapCanvas.style.left = `${img.offsetLeft}px`;
            
            const currentPicPoints = webgazerData.filter(d => d.pic === (swiper.activeIndex + 1));

            if (currentPicPoints.length === 0) {
                alert("No gaze data for this picture.");
                return;
            }

            ctx.clearRect(0, 0, heatmapCanvas.width, heatmapCanvas.height);
            const imgRect = img.getBoundingClientRect();

            currentPicPoints.forEach(point => {
                const localX = point.x - imgRect.left;
                const localY = point.y - imgRect.top;

                if (localX >= 0 && localX <= heatmapCanvas.width && localY >= 0 && localY <= heatmapCanvas.height) {
                    ctx.beginPath();
                    const gradient = ctx.createRadialGradient(localX, localY, 2, localX, localY, 25);
                    gradient.addColorStop(0, 'rgba(255, 69, 0, 0.15)');
                    gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(localX, localY, 25, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });

            heatmapCanvas.style.display = 'block';
            reviewBtn.innerText = "HIDE HEATMAP";
            message.innerText = `Reviewing Heatmap: Picture ${swiper.activeIndex + 1}. Use arrows to navigate.`;
        }
    </script>
</body>
</html>
