<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto EDNA / El Pez Volador - Protocolo MAIN Eyetracking (v3.1 Offline)</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f4; overflow: hidden; }
        h2 { margin: 20px 0; color: #333; }
        
        /* Botones Principales */
        .btn { padding: 15px 40px; font-size: 20px; cursor: pointer; border: none; border-radius: 8px; margin: 20px; }
        #startButton { background-color: #007bff; color: white; margin-top: 15%; }
        #stopButton { display: none; background-color: #dc3545; color: white; position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
        #reviewButton { display: none; background-color: #28a745; color: white; position: fixed; bottom: 20px; left: 20px; z-index: 2000; }

        /* Contenedor del Slideshow */
        #main-slideshow { display: none; width: 95%; max-width: 1200px; margin: 0 auto; height: 80vh; position: relative; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }

        /* Puntos de Calibración */
        .calibration-point { width: 30px; height: 30px; background-color: red; border-radius: 50%; position: absolute; cursor: pointer; z-index: 1000; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #calibracion-container { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.2); z-index: 1500; }
        
        /* Mensaje de Estado */
        #estado-mensaje { font-size: 1.4em; margin: 20px; min-height: 50px; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; display: inline-block;}

        /* Lienzo del Heatmap */
        #heatmap-canvas { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1800; pointer-events: none; }
    </style>
</head>
<body>

    <h2 id="estado-mensaje">Paso 1: Presiona INICIAR</h2>
    
    <button id="startButton" class="btn" onclick="iniciarExperimento()">INICIAR RECOLECCIÓN</button>
    <button id="stopButton" class="btn" onclick="detenerExperimento()">FINALIZAR Y GUARDAR</button>
    <button id="reviewButton" class="btn" onclick="mostrarHeatmap()">REVISAR HEATMAP</button>

    <div id="calibracion-container"></div>

    <div class="swiper mySwiper" id="main-slideshow">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="main_img/cat-picture1.png" alt="Lámina 1"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture2.png" alt="Lámina 2"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture3.png" alt="Lámina 3"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture4.png" alt="Lámina 4"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture5.png" alt="Lámina 5"></div>
            <div class="swiper-slide"><img src="main_img/cat-picture6.png" alt="Lámina 6"></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
        
        <canvas id="heatmap-canvas"></canvas>
    </div>

    <script src="webgazer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // --- VARIABLES DE CONTROL v3.1 ---
        let webgazerData = [];
        let mediaRecorder;
        let audioChunks = [];
        let isCalibrating = false;
        let participantID = "PILOTO";
        
        // Configuración de Calibración
        const calibrationPoints = [[10,10], [50,10], [90,10], [10,50], [50,50], [90,50], [10,90], [50,90], [90,90]];
        let currentPointIndex = 0;
        let calibrationClicks = 0;

        // Elementos del DOM
        const mensaje = document.getElementById('estado-mensaje');
        const startBtn = document.getElementById('startButton');
        const stopBtn = document.getElementById('stopButton');
        const reviewBtn = document.getElementById('reviewButton');
        const calibContainer = document.getElementById('calibracion-container');
        const slideshow = document.getElementById('main-slideshow');
        const heatmapCanvas = document.getElementById('heatmap-canvas');

        // --- INICIALIZACIÓN DE SWIPER ---
        const swiper = new Swiper('.mySwiper', {
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            pagination: { el: '.swiper-pagination', clickable: true },
            keyboard: { enabled: true },
        });

        // Al cambiar de slide, asegurarnos de limpiar el heatmap si estaba visible
        swiper.on('slideChange', () => {
            if(heatmapCanvas.style.display === 'block') {
                heatmapCanvas.style.display = 'none';
                reviewBtn.innerText = "REVISAR HEATMAP";
            }
        });

        // --- LÓGICA PRINCIPAL ---

        async function iniciarExperimento() {
            const inputID = prompt("ID del participante (ej: SAL-001):", "SAL-001");
            if (inputID) participantID = inputID.trim();

            startBtn.style.display = 'none';
            mensaje.innerText = "Paso 2: Calibración – Mira el punto rojo y haz clic 5 veces en cada uno.";

            // 1. Iniciar WebGazer y configurar el Listener SINCRONIZADO
            await webgazer.setGazeListener((data, elapsedTime) => {
                if (data && !isCalibrating) {
                    // AQUÍ ESTÁ LA CLAVE: Registramos la lámina actual (pic) en cada punto
                    webgazerData.push({ 
                        t: Math.round(elapsedTime), 
                        x: Math.round(data.x), 
                        y: Math.round(data.y),
                        pic: swiper.activeIndex + 1 // ID de la lámina (1-6)
                    });
                }
            }).begin();

            webgazer.showVideoPreview(true).showPredictionPoints(false);
            isCalibrating = true;
            calibContainer.style.display = 'block';
            createCalibrationPoint(0);
        }

        function createCalibrationPoint(index) {
            calibContainer.innerHTML = '';
            const [left, top] = calibrationPoints[index];
            const point = document.createElement('div');
            point.className = 'calibration-point';
            point.style.left = `${left}%`;
            point.style.top = `${top}%`;

            point.onclick = (e) => {
                webgazer.recordScreenClick(e.clientX, e.clientY);
                calibrationClicks++;
                point.style.opacity = 1 - (calibrationClicks * 0.18); // Feedback visual

                if (calibrationClicks >= 5) {
                    calibrationClicks = 0;
                    currentPointIndex++;
                    if (currentPointIndex < calibrationPoints.length) {
                        createCalibrationPoint(currentPointIndex);
                    } else {
                        terminarCalibracion();
                    }
                }
            };
            calibContainer.appendChild(point);
        }

        function terminarCalibracion() {
            isCalibrating = false;
            calibContainer.style.display = 'none';
            webgazer.showVideoPreview(false); // Ocultar cámara para no distraer

            mensaje.innerText = "Paso 3: Narra la historia con tus palabras...";
            slideshow.style.display = 'block';
            stopBtn.style.display = 'inline-block';
            swiper.slideTo(0); // Asegurar que empieza en la lámina 1

            // 2. Iniciar Grabación de Audio (Sincronizada con el inicio de la narrativa)
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = exportarAudio;
                mediaRecorder.start();
                console.log("Grabación de audio iniciada");
            }).catch(err => {
                console.error("Error micrófono:", err);
                alert("Atención: No se pudo iniciar la grabación de audio.");
            });
        }

        function detenerExperimento() {
            // Detener Audio
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            
            // Detener WebGazer (pero no cerrarlo para poder usar el heatmap)
            webgazer.pause();
            
            mensaje.innerText = "¡Finalizado! Guardando datos...";
            stopBtn.style.display = 'none';

            // 3. Exportar CSV Maestro (Gaze + Lámina ID)
            const headers = "tiempo_ms,x_px,y_px,lamina_id";
            const rows = webgazerData.map(d => `${d.t},${d.x},${d.y},${d.pic}`);
            guardarArchivo([headers, ...rows].join('\n'), `${participantID}_DATOS_COMPLETOS.csv`, 'text/csv');

            // Habilitar botón de revisión rápida (Heatmap)
            reviewBtn.style.display = 'inline-block';
        }

        function exportarAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            guardarArchivo(audioBlob, `${participantID}_NARRATIVA.webm`, 'audio/webm');
            audioChunks = []; // Limpiar para próxima prueba
        }

        function guardarArchivo(content, filename, type) {
            const blob = (content instanceof Blob) ? content : new Blob([content], { type: `${type};charset=utf-8;` });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        // --- MODO REVISIÓN RÁPIDA (HEATMAP) ---

        function mostrarHeatmap() {
            if (heatmapCanvas.style.display === 'block') {
                heatmapCanvas.style.display = 'none';
                reviewBtn.innerText = "REVISAR HEATMAP";
                return;
            }

            const ctx = heatmapCanvas.getContext('2d');
            
            // Ajustar el canvas al tamaño real de la imagen visualizada
            const activeSlide = swiper.slides[swiper.activeIndex];
            const img = activeSlide.querySelector('img');
            
            heatmapCanvas.width = img.clientWidth;
            heatmapCanvas.height = img.clientHeight;
            
            // Posicionar el canvas sobre la imagen (considerando el object-fit contain)
            heatmapCanvas.style.width = `${img.clientWidth}px`;
            heatmapCanvas.style.height = `${img.clientHeight}px`;
            heatmapCanvas.style.top = `${img.offsetTop}px`;
            heatmapCanvas.style.left = `${img.offsetLeft}px`;
            
            // Filtrar puntos de mirada que correspondan SOLO a la lámina actual
            const currentPicPoints = webgazerData.filter(d => d.pic === (swiper.activeIndex + 1));

            if (currentPicPoints.length === 0) {
                alert("No hay datos de mirada registrados para esta lámina.");
                return;
            }

            // Dibujar Heatmap simple (puntos acumulativos)
            ctx.clearRect(0, 0, heatmapCanvas.width, heatmapCanvas.height);
            
            // Obtener el offset del contenedor para ajustar coordenadas locales
            const containerRect = slideshow.getBoundingClientRect();
            const imgRect = img.getBoundingClientRect();

            currentPicPoints.forEach(point => {
                // Convertir coordenadas de pantalla a coordenadas locales del canvas de la imagen
                const localX = point.x - imgRect.left;
                const localY = point.y - imgRect.top;

                // Solo dibujar si el punto cae dentro de la imagen
                if (localX >= 0 && localX <= heatmapCanvas.width && localY >= 0 && localY <= heatmapCanvas.height) {
                    ctx.beginPath();
                    // Gradiente radial para simular heatmap (rojo intenso en el centro, transparente fuera)
                    const gradient = ctx.createRadialGradient(localX, localY, 2, localX, localY, 25);
                    gradient.addColorStop(0, 'rgba(255, 0, 0, 0.1)'); // Muy suave para acumular
                    gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.arc(localX, localY, 25, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });

            heatmapCanvas.style.display = 'block';
            reviewBtn.innerText = "OCULTAR HEATMAP";
            mensaje.innerText = `Revisando Heatmap de Lámina ${swiper.activeIndex + 1}. Usa las flechas para ver otras.`;
        }
    </script>

</body>
</html>
